<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>WILLDROW</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="icon" type="image/png" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WILLDROW"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#202020;--field:#262626;--line:#3a3a3a;--text:#fff;--mute:#9a9a9a;--lav:#b39ddb;--pri:#6200ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.card,.cover,.pick,header,h1,h2{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus,.card:focus{outline:none}
button:focus-visible,.card:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overscroll-behavior:none}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.app{width:100%;max-width:480px;margin:0 auto;padding:12px 16px 120px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;height:56px}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.06em}
.ic{background:none;border:0;color:var(--text);padding:6px;cursor:pointer;display:flex}
.bell{position:relative}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#555,#222);border:2px solid #333;position:relative;display:grid;place-items:center;font-weight:700}
.bar{display:flex;gap:12px;margin:14px 0 20px}
.search{flex:1;display:flex;align-items:center;gap:14px;background:var(--field);border:1px solid var(--line);border-radius:30px;padding:0 20px;height:56px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:16px}
.search input::placeholder{color:var(--mute)}
.sort{width:56px;height:56px;border-radius:50%;background:var(--field);border:1px solid var(--line);color:var(--text);cursor:pointer;display:grid;place-items:center}
.card{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;cursor:pointer}
.card:focus-visible,button:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.cover{flex:0 0 96px;height:128px;border-radius:14px;background:#0b0b0b;border:1px solid var(--line);display:grid;place-items:center;text-align:center;overflow:hidden;font-weight:800;line-height:.95;color:#f0a020;text-shadow:0 0 8px #c0300055}
.cover small{display:block;font-size:11px;font-style:italic;color:#d86a20;font-weight:600}
.info{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:8px}
.top h2{margin:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.top svg{flex:none}
.meta{margin:10px 0 0;font-size:16px;color:var(--mute);overflow-wrap:anywhere}
.meta b{color:var(--lav);font-weight:700}
.fab{position:fixed;right:max(24px,calc(50% - 216px));display:grid;place-items:center;width:56px;height:56px;border-radius:18px;border:0;cursor:pointer}
.fav{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#fff;color:var(--pri)}
.fav.on{background:var(--pri);color:#fff}
.add{bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff}
.empty{text-align:center;color:var(--mute);margin-top:60px}
dialog{width:min(92vw,420px);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:22px}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 14px}
dialog label{display:block;font-size:14px;color:var(--lav);margin:12px 0 6px;font-weight:600}
dialog input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px 14px;font-size:16px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--field);color:var(--text)}
.btn.p{background:var(--pri)}
#dlg,#odlg{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;max-height:94vh;overflow:auto;background:#1e1e1e;border:1px solid var(--line);border-bottom:0;border-radius:36px 36px 0 0;padding:12px 24px calc(20px + env(safe-area-inset-bottom,0px))}
#dlg[open],#odlg[open]{animation:sheet .25s ease-out}
#dlg,#odlg,.pbody{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#dlg[open],#odlg[open]{animation:none}}
.grip{position:relative;width:100%;height:40px;margin:-6px 0 6px;cursor:grab;touch-action:none}
.grip::after{content:"";position:absolute;left:50%;top:16px;width:56px;height:5px;margin-left:-28px;border-radius:3px;background:#666}
#dlg h3,#odlg h3{text-align:center;font-size:26px;font-weight:700;margin:0 0 18px}
.pick{display:block;position:relative;width:120px;height:120px;margin:0 auto 22px;border:0;border-radius:22px;background:#2c2c2c center/cover no-repeat;cursor:pointer;color:inherit}
.pick svg{position:absolute;left:42px;top:42px;width:36px;height:36px}
.pick .plus{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:#b99cf4;color:#fff;font-size:26px;line-height:31px;text-align:center;font-weight:700}
.pick.has .plus{display:none}
.pick.has svg{display:none}
.pick input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.fld{display:block;width:100%;margin:0 0 16px;height:58px;background:transparent;border:1px solid #555;border-radius:20px;color:var(--text);padding:0 20px;font:inherit;font-size:18px}
textarea.fld{height:96px;padding:16px 20px;resize:none}
.fld::placeholder{color:#aaa}
.fld:focus{outline:2px solid var(--lav);border-color:transparent}
.imp{display:block;width:100%;height:56px;border:0;border-radius:28px;background:#ffd600;color:#000;font-size:18px;font-weight:700;cursor:pointer;margin:6px 0 18px}
.acts{display:flex;gap:12px}
.acts button{flex:1;height:60px;border:0;border-radius:18px;font-size:18px;font-weight:700;cursor:pointer}
.cn{background:#b99cf4;color:#000}
.sv{background:var(--pri);color:#fff}
.dots{flex:none;background:none;border:0;color:#bbb;padding:4px;margin-right:-6px;cursor:pointer;display:flex}
#menu{position:fixed;z-index:50;min-width:150px;background:#2a2a2a;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 24px #000a}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;font-size:17px;padding:14px 16px;border-radius:12px;cursor:pointer}
#menu button:hover{background:#383838}
#menu button[data-a="del"]{color:#ff6b6b}
#cdlg{max-width:340px;padding:24px;border-radius:24px}
#cdlg h3{text-align:left;font-size:22px;margin:0 0 10px}
#cmsg{color:#bbb;margin:0 0 20px;overflow-wrap:anywhere}
#cdlg .acts button{height:52px}
button{position:relative}
button,.card,.ic,.avatar,.pick{overflow:hidden}
.ic{border-radius:50%}
.dots{border-radius:50%;padding:8px;margin:-4px -10px -4px 0}
.ripple{position:absolute;border-radius:50%;background:rgba(170,170,170,.45);pointer-events:none;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{0%{transform:scale(0);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple{animation:none;transform:scale(1);opacity:.5}}
[hidden]{display:none!important}
.sub{display:flex;align-items:center;justify-content:space-between;height:52px;margin-top:8px}
.sub h2{margin:0;font-size:20px;font-weight:700;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.fnd input{width:100%;height:46px;background:var(--field);border:1px solid var(--line);border-radius:23px;color:#fff;padding:0 18px;font-size:16px;margin-bottom:8px}
.tools{display:flex;justify-content:space-between;padding:10px 4px 4px}
.tools .ic{color:#8a8a8a}
.tools .ic.hm{color:#b39ddb}
.chev{margin:0 auto 10px;color:#aaa}
.ln{display:block;width:100%;background:transparent;border:0;border-radius:0;outline:0;color:#fff;font:16px/1.5 "Courier Prime","Courier New",Courier,monospace;resize:none;overflow:hidden;padding:8px;margin:0}
.ln::placeholder{color:#666}
.t-scene{background:#2e2e2e;border-bottom:1px solid #aaa;text-transform:uppercase;font-weight:700;margin-top:8px}
.t-character{text-transform:uppercase;padding-left:30%}
.t-dialogue{padding-left:15%;padding-right:12%}
.t-parenthetical{padding-left:22%;padding-right:18%;font-style:italic}
.t-transition{text-transform:uppercase;text-align:right}
.ln.bm{box-shadow:inset 3px 0 0 #b39ddb}
.ln.hit{outline:2px solid #b39ddb}
.types{flex:none;display:flex;overflow-x:auto;overflow-y:hidden;background:#2a2a2a;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-top:1px solid var(--line)}
.types::-webkit-scrollbar{display:none}
#sug{flex:none;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px 12px;background:#2a2a2a;border-top:1px solid var(--line);scrollbar-width:none;touch-action:pan-x}
#sug::-webkit-scrollbar{display:none}
#sug[hidden]{display:none}
.chip{flex:none;border:0;border-radius:18px;background:#3d3d3d;color:#fff;font:600 15px/1 inherit;font-family:inherit;padding:10px 16px;white-space:nowrap;cursor:pointer;text-transform:uppercase}
.chip b{color:#b39ddb;font-weight:700}
.ty{touch-action:pan-x;flex:0 0 20%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#bbb;font-size:11px;cursor:pointer;padding:2px 0;white-space:nowrap}
.ty svg{width:18px;height:18px}
.ty .pl{width:40px;height:24px;border-radius:12px;display:grid;place-items:center}
.ty.on{color:#fff;font-weight:700}
.ty.on .pl{background:#6200ee;color:#fff}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;z-index:60;font-size:15px}
.ln{border-bottom:1px solid #9a9a9a;padding:16px 8px}
.ln::placeholder{color:#5f5f5f}
.t-scene{margin-top:0}
.t-character{text-align:center;padding-left:8px;font-weight:700}
.t-dialogue{text-align:center;padding-left:8px;padding-right:8px}
.t-parenthetical{text-align:center;padding-left:8px;padding-right:8px}
.t-transition{font-weight:700}
.tools .ic.act{color:#b39ddb}
#ed{position:fixed;left:0;right:0;top:0;height:100%;max-width:480px;margin:0 auto;padding:0;display:flex;flex-direction:column;overflow:hidden;z-index:5;background:var(--bg)}
.edtop{flex:none;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
#edScroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 40px;touch-action:pan-y}
html.edit,html.edit body{overflow:hidden;height:100%;min-height:0}
#ed.kb .types{padding-bottom:6px}
#ed.kb .edtop>header{display:none}
#ed.kb .edtop{padding-top:calc(4px + env(safe-area-inset-top,0px))}
#ed.kb .chev{margin-bottom:2px}

#odlg{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:64px;margin:0 0 14px;padding:0 22px;background:transparent;border:1px solid #555;border-radius:20px;color:#fff;font:inherit;font-size:20px;cursor:pointer;text-align:left}
.opt svg{flex:none}
#printArea{display:none}
@media print{
 @page{margin:1in}
 html,html.edit,html.edit body,body{background:#fff!important;color:#000!important;overflow:visible!important;height:auto!important;padding:0!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 .pa{font:12pt/1.2 "Courier Prime","Courier New",Courier,monospace;color:#000}
 .pa p{margin:0 0 12pt;white-space:pre-wrap;overflow-wrap:anywhere}
 .pa .tp{text-align:center;padding-top:2.5in;page-break-after:always}
 .pa .tp h1{font-size:22pt;text-transform:uppercase;margin:0 0 .6in;letter-spacing:0}
 .pa .scene{text-transform:uppercase;font-weight:700;margin-top:18pt}
 .plogo{position:fixed;top:-.75in;left:0;right:0;font:700 10pt/1 Arial,Helvetica,sans-serif;letter-spacing:.14em;color:#444}
 .plogo img{height:.45in;max-width:2in;object-fit:contain}
 .plogo.l{text-align:left}.plogo.c{text-align:center}.plogo.r{text-align:right}
 .pa .character{text-transform:uppercase;margin-left:2.2in;margin-bottom:0;page-break-after:avoid}
 .pa .parenthetical{margin-left:1.6in;margin-right:1.4in;margin-bottom:0;page-break-after:avoid}
 .pa .dialogue{margin-left:1in;margin-right:1in}
 .pa .transition{text-transform:uppercase;text-align:right}
}

#pdlg{width:min(92vw,420px);max-height:92vh;background:#2c2c2c;border:1px solid #444;border-radius:28px;padding:0;overflow:hidden}
#pdlg[open]{display:flex;flex-direction:column}
#pdlg h3{text-align:center;font-size:30px;font-weight:700;margin:0;padding:22px 20px 8px}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px 8px;overscroll-behavior:contain}
.lbl{text-align:center;font-size:20px;font-weight:700;margin:18px 0 10px}
.seg{display:flex;gap:12px}
.seg button{flex:1;height:60px;border:0;border-radius:20px;background:#4a4a4a;color:#ddd;font:inherit;font-size:19px;cursor:pointer;padding:0 6px}
.seg button.on{background:#6200ee;color:#fff;font-weight:700}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:58px;background:#222;border:1px solid #666;border-radius:20px;color:#fff;font:inherit;font-size:20px;padding:0 54px 0 22px}
.sel svg{position:absolute;right:20px;top:17px;pointer-events:none;color:#fff}
.tgr{display:flex;align-items:center;justify-content:space-between;margin:20px 6px 0;font-size:20px}
.tg{width:60px;height:36px;border-radius:18px;border:2px solid #777;background:#333;padding:0;cursor:pointer;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:#6200ee;border-color:#6200ee}
.tg.on::after{transform:translateX(24px)}
#cvBtn{margin:20px 0 0;height:58px;font-size:20px}
#cvEdit{margin-top:14px}
#cvEdit .fld{height:52px;margin-bottom:10px;font-size:17px}
.pill{width:max-content;max-width:100%;margin:18px auto 6px;padding:6px 20px;border-radius:20px;background:#3a3a3a;color:#ddd;font-size:17px;font-weight:600}
.pfoot{flex:none;display:flex;gap:12px;padding:12px 20px 20px;background:#2c2c2c}
.pfoot button{flex:1;height:60px;border:0;border-radius:20px;font-size:20px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){.tg::after{transition:none}}
</style>
</head>
<body>
<div class="app" id="home">
  <header>
    <button class="ic" aria-label="Menu"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <h1>WILLDROW</h1>
    <button class="ic bell" aria-label="Notifications"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 0 0 4 0"/></svg></button>
    <div class="avatar" aria-label="Profile"><svg width="26" height="26" viewBox="0 0 24 24" fill="#cfcfcf"><circle cx="12" cy="8" r="4.5"/><path d="M3.500 21c0-4.500 3.800-7 8.500-7s8.500 2.500 8.500 7z"/></svg></div>
  </header>

  <div class="bar">
    <label class="search">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search in WILLDROW" autocomplete="off">
    </label>
  </div>

  <main id="list"></main>

  <button class="fab fav" id="favBtn" aria-label="Show favorites"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.700-8 11-8 11z"/></svg></button>
  <button class="fab add" id="addBtn" aria-label="New script"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>
</div>

<div class='app' id='ed' hidden>
 <div class='edtop'>
  <header>
    <button class='ic' aria-label='Menu'><svg width='30' height='30' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M3 6h18M3 12h18M3 18h18'/></svg></button>
    <h1>WILLDROW</h1>
    <span style='width:42px'></span>
  </header>
  <div class='sub'>
    <button class='ic' id='edBack' aria-label='Back'><svg width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 12H5M11 5l-7 7 7 7'/></svg></button>
    <h2 id='edT'></h2>
    <button class='ic' id='edSearch' aria-label='Search in script'><svg width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-4-4'/></svg></button>
  </div>
  <div class='fnd' id='find' hidden><input id='findIn' placeholder='Find in script' autocomplete='off'></div>
  <div class='tools' id='tools'>
    <button class='ic hm' id='edHome' aria-label='Top'><svg width='34' height='34' viewBox='0 0 24 24' fill='currentColor'><path d='M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z'/></svg></button>
    <button class='ic' id='edUndo' aria-label='Undo'><svg width='34' height='34' viewBox='0 0 24 24' fill='currentColor'><path d='M12.500 8c-2.600 0-5 1-6.800 2.600L2 7v9h9l-3.600-3.600A8 8 0 0 1 12.500 10c3.500 0 6.500 2.300 7.600 5.500l2.400-.8C21.100 10.700 17.200 8 12.500 8z'/></svg></button>
    <button class='ic' id='edRedo' aria-label='Redo'><svg style='transform:scaleX(-1)' width='34' height='34' viewBox='0 0 24 24' fill='currentColor'><path d='M12.500 8c-2.600 0-5 1-6.800 2.600L2 7v9h9l-3.600-3.600A8 8 0 0 1 12.500 10c3.500 0 6.500 2.300 7.600 5.500l2.400-.8C21.100 10.700 17.200 8 12.500 8z'/></svg></button>
    <button class='ic' id='edTag' aria-label='Tags'><svg width='34' height='34' viewBox='0 0 24 24' fill='currentColor'><path d='M21.400 11.600l-9-9A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7c0 .5.2 1 .6 1.400l9 9a2 2 0 0 0 2.800 0l7-7a2 2 0 0 0 0-2.800zM6.500 8a1.500 1.500 0 1 1 0-3 1.500 1.500 0 0 1 0 3z'/></svg></button>
    <button class='ic' id='edBm' aria-label='Bookmark line'><svg width='34' height='34' viewBox='0 0 24 24' fill='currentColor'><path d='M5 3h14v18l-7-4-7 4z'/></svg></button>
    <button class='ic' id='edMore' aria-label='Options'><svg width='34' height='34' viewBox='0 0 24 24' fill='currentColor'><circle cx='12' cy='5' r='2'/><circle cx='12' cy='12' r='2'/><circle cx='12' cy='19' r='2'/></svg></button>
  </div>
  <button class='ic chev' id='chev' aria-label='Hide toolbar'><svg width='28' height='28' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 15l6-6 6 6'/></svg></button>
 </div>
 <div id='edScroll'><div id='lines'></div></div>
 <div id='sug' hidden></div>
 <div class='types' id='types' hidden></div>
</div>
<div id='toast' hidden></div>
<dialog id="pdlg">
  <h3>Export to PDF</h3>

function nativePdfLines(buf){

function parseScript(txt){

  var SC=/^(\.(?=\w)|(INT|EXT|EST|INT\.?\/EXT|EXT\.?\/INT|I\/E)[\. ])/i;
  blocks.forEach(function(b){
    var first=b[0];

  revealT=Date.now();
  var r=a.getBoundingClientRect(),s=scr.getBoundingClientRect();
  if(r.bottom>s.bottom-12)scr.scrollTop+=r.bottom-(s.bottom-12);
  else if(r.top<s.top+8)scr.scrollTop-=s.top+8-r.top;
}
function isLn(a){return a&&a.classList&&a.classList.contains("ln")}
function kbUpdate(){var ed0=$("ed"),h0=ed0.style.height;fitEd();if(ed0.style.height===h0)return;setTimeout(function(){if(isLn(document.activeElement))reveal(document.activeElement)},60)}
if(navigator.virtualKeyboard){
  navigator.virtualKeyboard.overlaysContent=true;
  navigator.virtualKeyboard.addEventListener("geometrychange",function(e){vkH=e.target.boundingRect.height;kbUpdate()});
}
if(vv){vv.addEventListener("resize",kbUpdate);vv.addEventListener("scroll",fitEd)}
window.addEventListener("resize",kbUpdate);
function kbH(){var v=window.visualViewport,k=vkH||0;if(v)k=Math.max(k,Math.round(window.innerHeight-v.height-v.offsetTop));return Math.max(0,k)}
function fitSheets(){
  var kb=kbH(),avail=window.innerHeight-kb;
  ["dlg","odlg"].forEach(function(id){var d=$(id);if(!d.open)return;d.style.bottom=kb+"px";d.style.maxHeight=Math.max(200,avail-8)+"px"});
  var p=$("pdlg");if(p.open)p.style.maxHeight=Math.max(240,avail-16)+"px";
}
["dlg","odlg","pdlg"].forEach(function(id){
  var d=$(id);
  d.addEventListener("close",function(){d.style.bottom="";d.style.maxHeight=""});
  d.addEventListener("focusin",function(e){
    var t=e.target;
    [100,350,700].forEach(function(ms){setTimeout(function(){
      fitSheets();
      if(document.activeElement===t&&t.scrollIntoView)try{t.scrollIntoView({block:"center",behavior:"auto"})}catch(err){}
    },ms)});
  });
  d.addEventListener("focusout",function(){setTimeout(fitSheets,300)});
});
if(vv){vv.addEventListener("resize",fitSheets);vv.addEventListener("scroll",fitSheets)}
window.addEventListener("resize",fitSheets);
if(navigator.virtualKeyboard)navigator.virtualKeyboard.addEventListener("geometrychange",fitSheets);

window.addEventListener("orientationchange",function(){setTimeout(function(){baseH=window.innerHeight;forceKb=0;fitEd()},500)});
document.addEventListener("focusin",function(e){
  if(!isLn(e.target))return;
  userScrollT=0;
  setTimeout(function(){
    if(document.activeElement!==e.target)return;
    var h=vv?vv.height:window.innerHeight;
    if(!vkH&&h>=baseH-80&&matchMedia("(pointer:coarse)").matches)forceKb=Math.round(window.innerHeight*0.42);
    fitEd();reveal(e.target);
  },450);
});
document.addEventListener("focusin",function(e){if(isLn(e.target)){userScrollT=0;[150,400,800,1300].forEach(function(t){setTimeout(function(){fitEd();var a=document.activeElement;if(isLn(a))reveal(a)},t)})}});
document.addEventListener("focusout",function(){
  setTimeout(function(){if(!isLn(document.activeElement)){forceKb=0;fitEd()}},150);
});
document.addEventListener("pointerdown",function(e){
  var t=e.target.closest&&e.target.closest("button,.avatar,.pick");
  if(!t||t.disabled||t.matches(".imp,.acts button"))return;
  var r=t.getBoundingClientRect(),size=Math.max(r.width,r.height)*2,s=document.createElement("span");
  s.className="ripple";
  s.style.width=s.style.height=size+"px";
  s.style.left=(e.clientX-r.left-size/2)+"px";
  s.style.top=(e.clientY-r.top-size/2)+"px";
  t.appendChild(s);
  setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},600);
},{passive:true});
window.addEventListener("scroll",closeMenu,{passive:true});
(function(){
  var g=document.querySelector(".grip"),d=$("dlg"),y0=0,dy=0,drag=false;
  g.addEventListener("pointerdown",function(e){drag=true;y0=e.clientY;dy=0;d.style.transition="none";g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",function(e){if(!drag)return;dy=Math.max(0,e.clientY-y0);d.style.transform="translateY("+dy+"px)"});
  function end(){
    if(!drag)return;drag=false;d.style.transition="transform .2s ease-out";
    if(dy>80){d.style.transform="translateY(100%)";setTimeout(function(){d.close();d.style.transform="";d.style.transition=""},200)}
    else{d.style.transform="";setTimeout(function(){d.style.transition=""},220)}
  }
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
})();
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
render();
</script>
